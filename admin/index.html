<!DOCTYPE html>
<html lang="de" class="identity-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freibad CMS</title>
  <style>
    /* CMS erst anzeigen, wenn Identity einen User bestätigt hat */
    html:not(.identity-logged-in) #nc-root {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Erforderlich für Login mit Netlify Identity + Git Gateway -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      function setAuthState(loggedIn) {
        document.documentElement.classList.remove("identity-pending");
        document.documentElement.classList.toggle("identity-logged-in", loggedIn);
      }

      function watchCmsRoot(loggedIn) {
        const apply = function () {
          const root = document.getElementById("nc-root");
          if (root) root.hidden = !loggedIn;
        };
        apply();
        if (!loggedIn) {
          const obs = new MutationObserver(apply);
          obs.observe(document.body, { childList: true, subtree: true });
          window.netlifyIdentity.on("login", function () {
            obs.disconnect();
          });
        }
      }

      window.netlifyIdentity.on("init", function (user) {
        const loggedIn = Boolean(user);
        setAuthState(loggedIn);
        watchCmsRoot(loggedIn);

        window.netlifyIdentity.on("login", function () {
          setAuthState(true);
          watchCmsRoot(true);
        });

        window.netlifyIdentity.on("logout", function () {
          setAuthState(false);
          window.location.replace("/admin/");
        });
      });
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
</body>
</html>
