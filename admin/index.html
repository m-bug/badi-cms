<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freibad CMS</title>
  <style>
    .admin-site-link {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .admin-site-link a {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background: #0d6e8a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      box-shadow: 0 2px 12px rgb(0 0 0 / 12%);
    }

    .admin-site-link a:hover {
      background: #094d61;
    }
  </style>
</head>
<body>
  <p class="admin-site-link">
    <a href="/">← Zur Startseite</a>
  </p>

  <!-- Erforderlich für Login mit Netlify Identity + Git Gateway -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      if (!window.netlifyIdentity) return;

      window.netlifyIdentity.on("logout", function () {
        window.netlifyIdentity.close();
        // Seite neu laden, damit Decap nicht mit alter Oberfläche hängen bleibt
        window.location.replace("/admin/");
      });
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
</body>
</html>
