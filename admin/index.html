<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freibad CMS</title>
</head>
<body>
  <!-- Erforderlich für Login mit Netlify Identity + Git Gateway -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      if (!window.netlifyIdentity) return;

      window.netlifyIdentity.on("logout", function () {
        window.netlifyIdentity.close();
        // Seite neu laden, damit Decap nicht mit alter Oberfläche hängen bleibt
        window.location.replace("/admin/");
      });
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
</body>
</html>
